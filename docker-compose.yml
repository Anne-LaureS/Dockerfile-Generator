services:
  nginx:
    image: nginx:1.31-alpine
    container_name: nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      - appnet

  redis:
    image: redis:8.10.1-alpine
    container_name: redis-cache
    # Pas de "ports:" ici volontairement — rien n'a besoin d'atteindre Redis depuis
    # l'hôte. L'exposer sur le port hôte 6379 sans authentification serait directement
    # scannable/exploitable depuis l'extérieur (Redis n'a pas d'auth activée par défaut).
    expose:
      - "6379"
    networks:
      - appnet

networks:
  appnet:
