services:
  app:
    build: .
    container_name: python-app
    expose:
      - "80"
    networks:
      - appnet

  nginx:
    image: nginx:1.31-alpine
    container_name: nginx
    ports:
      - "8080:80"

    # --- MODE 1 : Reverse Proxy vers l'application Python ---
    # Activer ce mode en décommentant les 2 lignes suivantes :
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    # --- MODE 2 : Serveur statique (index.html) ---
    # Activer ce mode en décommentant les 2 lignes suivantes (et en commentant le mode 1 ci-dessus) :
    # volumes:
    #   - ./html:/usr/share/nginx/html:ro

    depends_on:
      - app
    networks:
      - appnet

  redis:
    image: redis:8.10.1-alpine
    container_name: redis-cache
    # Pas de "ports:" ici volontairement — seul le service "app" (sur le même réseau
    # appnet) a besoin d'atteindre Redis. L'exposer sur le port hôte 6379 sans
    # authentification serait directement scannable/exploitable depuis l'extérieur
    # (Redis n'a pas d'auth activée par défaut).
    expose:
      - "6379"
    networks:
      - appnet

networks:
  appnet:
