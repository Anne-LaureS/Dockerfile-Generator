events {}

http {
    # Masque la version nginx dans les en-têtes de réponse et les pages d'erreur —
    # évite de faciliter le ciblage de vulnérabilités connues pour une version précise.
    server_tokens off;

    server {
        listen 80;

        location / {
            proxy_pass http://app:80;
        }
    }
}
