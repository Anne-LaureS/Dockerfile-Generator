name: Publish tool image to GHCR

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - "feature/python-script/generate_dockerfile.py"
      - ".github/workflows/publish-image.yml"

# Aucune permission par défaut : ce job ne déclare que ce dont il a besoin.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/anne-laures/dockerfile-generator:latest
            ghcr.io/anne-laures/dockerfile-generator:${{ github.sha }}
